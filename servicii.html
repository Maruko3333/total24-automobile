<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leistungen | Total24 Automobile Fürth</title>
  <meta name="description" content="Leistungen von Total24 Automobile: Fahrzeuge aus erster Hand, vollständige Prüfung, Scheckheftpflege und Finanzierungslösungen.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=49">
  <link rel="icon" href="assets/img/brand/favicon.png">
  <link rel="icon" href="assets/img/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/brand/favicon-64.png">
  <meta name="theme-color" content="#0e2b3e">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Total24 Automobile">
  <meta property="og:image" content="https://maruko3333.github.io/total24-automobile/assets/img/brand/showroom.jpg">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <div id="site-header"></div>

  <section class="page-hero">
    <div class="container">
      <h1>Unsere Leistungen</h1>
      <p>Alles für einen sorgenfreien Fahrzeugkauf.</p>
    </div>
  </section>

  <section class="section" style="padding-top:34px">
    <div class="container">
      <div class="services-grid" id="servicesGrid"></div>

      <div class="tradein-band">
        <div class="tradein-img" id="tradeinImg"></div>
        <div class="tradein-content">
          <h3>Fahrzeug in Zahlung geben?</h3>
          <p>Wir rechnen Ihr Fahrzeug beim Kauf aus unserem Bestand an. Faire und schnelle Bewertung — direkt vor Ort.</p>
          <a href="contact.html" class="btn btn-primary">Kontakt aufnehmen</a>
        </div>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="assets/js/app.js?v=3"></script>
  <script>
    (async () => {
      await T24.mount('servicii');
      const services = [
        ['award', 'Fahrzeuge aus erster Hand', 'Fahrzeuge mit nur einem Vorbesitzer, sorgfältig für Sie ausgewählt.'],
        ['wrench', 'Scheckheftgepflegt', 'Wartung ausschließlich bei der offiziellen Markenwerkstatt.'],
        ['shield', 'Vollständige Prüfung', 'Jedes Fahrzeug wird vor dem Verkauf technisch und optisch geprüft.'],
        ['percent', 'Finanzierung', 'Attraktive Finanzierungslösungen über unsere Partner.']
      ];
      document.getElementById('servicesGrid').innerHTML = services.map(([ic, t, d]) =>
        `<div class="service-card"><div class="ic">${T24.icon(ic, 28, 1.6)}</div><h3>${t}</h3><p>${d}</p></div>`).join('');
      document.getElementById('tradeinImg').innerHTML = T24.icon('car', 60, 1.2);
    })();
  </script>
</body>
</html>
