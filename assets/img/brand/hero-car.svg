<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" fill="none">
  <defs>
    <linearGradient id="stroke" x1="60" y1="80" x2="640" y2="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eaf4ff"/>
      <stop offset=".5" stop-color="#5aa9ff"/>
      <stop offset="1" stop-color="#2f78e6"/>
    </linearGradient>
    <linearGradient id="glass" x1="250" y1="88" x2="470" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4d9fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2f78e6" stop-opacity=".18"/>
    </linearGradient>
    <radialGradient id="head" cx="0" cy="0" r="1" gradientTransform="translate(74 176) scale(26)">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#bfe0ff"/>
      <stop offset="1" stop-color="#bfe0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- reflexie sub mașină -->
  <ellipse cx="360" cy="228" rx="290" ry="16" fill="#4d9fff" opacity=".14"/>

  <!-- corp semi-transparent (întunecă inelele din spate) -->
  <path d="M60 214 C52 186 72 176 100 174 L180 166 C210 164 220 158 236 138 L280 100
           C292 90 306 86 324 86 L436 86 C460 86 472 94 480 110 L516 160 L600 162
           C624 163 638 172 640 192 L640 214 L568 214 A50 50 0 0 1 468 214
           L252 214 A50 50 0 0 1 152 214 Z"
        fill="#0b0e12" fill-opacity=".62"/>

  <!-- geamuri -->
  <path d="M256 130 L290 104 C300 96 312 94 326 94 L432 94 C450 94 460 100 468 114 L484 130 Z"
        fill="url(#glass)"/>
  <rect x="366" y="94" width="6" height="38" rx="2" fill="#5aa9ff" fill-opacity=".5"/>

  <!-- contur luminos caroserie -->
  <path d="M60 214 C52 186 72 176 100 174 L180 166 C210 164 220 158 236 138 L280 100
           C292 90 306 86 324 86 L436 86 C460 86 472 94 480 110 L516 160 L600 162
           C624 163 638 172 640 192 L640 214 L568 214 A50 50 0 0 1 468 214
           L252 214 A50 50 0 0 1 152 214 Z"
        stroke="url(#stroke)" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- far -->
  <circle cx="74" cy="176" r="22" fill="url(#head)"/>

  <!-- roți -->
  <g stroke="url(#stroke)" fill="#0b0e12" fill-opacity=".55">
    <circle cx="518" cy="214" r="42" stroke-width="2.8"/>
    <circle cx="202" cy="214" r="42" stroke-width="2.8"/>
  </g>
  <g stroke="#5aa9ff" stroke-opacity=".55" stroke-width="5" fill="none">
    <circle cx="518" cy="214" r="20"/>
    <circle cx="202" cy="214" r="20"/>
  </g>
  <g fill="#eaf4ff">
    <circle cx="518" cy="214" r="4"/>
    <circle cx="202" cy="214" r="4"/>
  </g>
</svg>
