<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt | Total24 Automobile Fürth</title>
  <meta name="description" content="Kontaktieren Sie Total24 Automobile in Fürth, Deutschland. Telefon, E-Mail, Öffnungszeiten und Kontaktformular.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=41">
  <link rel="icon" href="assets/img/brand/favicon.png">
  <link rel="icon" href="assets/img/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/brand/favicon-64.png">
  <meta name="theme-color" content="#0e2b3e">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Total24 Automobile">
  <meta property="og:image" content="https://maruko3333.github.io/total24-automobile/assets/img/brand/showroom.jpg">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <div id="site-header"></div>

  <section class="page-hero">
    <div class="container">
      <h1>Kontakt</h1>
      <p>Wir sind für Sie da — schreiben oder rufen Sie uns an.</p>
    </div>
  </section>

  <section class="section" style="padding-top:34px">
    <div class="container">
      <div class="contact-cta" id="contactCTA"></div>
      <div class="contact-grid">
        <div>
          <h3 class="contact-col-title">Besuchen Sie uns</h3>
          <div class="contact-info" id="contactInfo"></div>
        </div>
        <div class="contact-form">
          <h3 style="margin-bottom:20px">Kontakt aufnehmen</h3>
          <form id="contactForm">
            <div class="field"><label>Name</label><input type="text" name="name" required></div>
            <div class="field"><label>Telefon</label><input type="tel" name="phone" required></div>
            <div class="field"><label>E-Mail</label><input type="email" name="email"></div>
            <div class="field"><label>Nachricht</label><textarea name="message" required></textarea></div>
            <button type="submit" class="btn btn-primary btn-block">Anfrage senden</button>
          </form>
          <p id="formNote" style="margin-top:14px;font-size:13px;color:var(--text-muted)"></p>
          <p class="contact-mobilede-note" id="contactMobileDe"></p>
        </div>
      </div>

      <div class="contact-map" style="margin-top:40px">
        <iframe id="contactMapFrame" title="Karte — Total24 Automobile" loading="lazy" src=""></iframe>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="assets/js/app.js?v=2"></script>
  <script>
    (async () => {
      await T24.mount('contact');
      const c = T24.config.company;
      const wa = (c.whatsapp || '').replace(/\D/g, '');
      const mapAddr = `${c.address.street}, ${c.address.zip} ${c.address.city}, ${c.address.country}`;
      const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(mapAddr)}`;
      // Karte an der genauen Adresse (synchron mit config)
      const mapFrame = document.getElementById('contactMapFrame');
      if (mapFrame) mapFrame.src = `https://www.google.com/maps?q=${encodeURIComponent(mapAddr)}&output=embed`;

      // Schnellaktionen
      document.getElementById('contactCTA').innerHTML = `
        <a href="https://wa.me/${wa}" target="_blank" rel="noopener" class="btn btn-wa">${T24.icon('whatsapp', 20)} WhatsApp schreiben</a>
        <a href="tel:${c.phone}" class="btn btn-primary">${T24.icon('phone', 20)} Jetzt anrufen</a>
        <a href="${navUrl}" target="_blank" rel="noopener" class="btn btn-outline">${T24.icon('pin', 20)} Route berechnen</a>`;

      // Kontaktdaten
      const info = [
        ['pin', 'Adresse', `${c.name} · ${c.address.street}<br>${c.address.zip} ${c.address.city}, ${c.address.country}<br><a href="${navUrl}" target="_blank" rel="noopener" style="color:var(--gold)">In Google Maps öffnen →</a>`],
        ['phone', 'Telefon', `<a href="tel:${c.phone}">${c.phone}</a>`],
        ['whatsapp', 'WhatsApp', `<a href="https://wa.me/${wa}" target="_blank" rel="noopener">Schreiben Sie uns auf WhatsApp</a>`],
        ['mail', 'E-Mail', `<a href="mailto:${c.email}">${c.email}</a>`],
        ['clock', 'Öffnungszeiten', `Mo – Fr: ${c.hours.weekdays}<br>Sa: ${c.hours.saturday}<br>So: geschlossen`]
      ];
      document.getElementById('contactInfo').innerHTML = info.map(([ic, t, d]) =>
        `<div class="info-item"><div class="ic">${T24.icon(ic, 22, 1.7)}</div>
         <div><h4>${t}</h4><p>${d}</p></div></div>`).join('');

      // „Auch über Mobile.de erreichbar" — link către profilul dealerului
      if (c.mobileDeUrl) document.getElementById('contactMobileDe').innerHTML =
        `Auch über <a href="${c.mobileDeUrl}" target="_blank" rel="noopener">Mobile.de erreichbar ${T24.icon('arrowRight', 13)}</a>`;

      // Formular -> E-Mail (FormSubmit), gebrandet + mit Auto-Antwort; Fallback WhatsApp
      document.getElementById('contactForm').addEventListener('submit', async e => {
        e.preventDefault();
        const f = e.target;
        const note = document.getElementById('formNote');
        const btn = f.querySelector('button[type=submit]');
        const orig = btn.textContent;
        btn.disabled = true; btn.textContent = 'Wird gesendet...';
        try {
          await T24.sendLead({
            _subject: `Total24 Automobile — Neue Kontaktanfrage von ${f.name.value}`,
            _template: 'box',
            ...(f.email.value ? {
              _replyto: f.email.value,
              _autoresponse:
                `Hallo ${f.name.value},\n\n` +
                `vielen Dank für Ihre Nachricht an Total24 Automobile. ` +
                `Wir haben Ihre Anfrage erhalten und melden uns so schnell wie möglich bei Ihnen.\n\n` +
                `Ihre Nachricht:\n"${f.message.value}"\n\n` +
                `Mit freundlichen Grüßen\n` +
                `Ihr Team von Total24 Automobile\n` +
                `${c.phone} · ${c.email}`
            } : {}),
            Name: f.name.value,
            Telefon: f.phone.value,
            'E-Mail': f.email.value || '—',
            Nachricht: f.message.value
          });
          note.style.color = 'var(--green)';
          note.textContent = 'Vielen Dank! Ihre Nachricht wurde gesendet — wir melden uns in Kürze.';
          f.reset();
        } catch (err) {
          note.style.color = 'var(--red)';
          note.innerHTML = `Senden momentan nicht möglich. Schreiben Sie uns direkt auf <a href="https://wa.me/${wa}" target="_blank" rel="noopener" style="color:var(--gold)">WhatsApp</a> oder rufen Sie an.`;
        } finally {
          btn.disabled = false; btn.textContent = orig;
        }
      });

      // Strukturierte Daten — Autohaus (SEO)
      T24.setCanonical(`${T24.siteUrl()}/contact.html`);
      T24.addJsonLd({
        '@context': 'https://schema.org', '@type': 'AutoDealer',
        name: c.name, telephone: c.phone, email: c.email, url: T24.siteUrl(),
        image: `${T24.siteUrl()}/assets/img/brand/logo.png`,
        address: { '@type': 'PostalAddress', streetAddress: c.address.street, postalCode: c.address.zip, addressLocality: c.address.city, addressCountry: 'DE' },
        sameAs: [c.mobileDeUrl].filter(Boolean),
        openingHours: ['Mo-Fr 08:00-17:00', 'Sa 09:00-12:00']
      });
    })();
  </script>
</body>
</html>
