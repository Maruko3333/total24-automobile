<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Total24 Automobile</title>
  <meta name="description" content="Contactează Total24 Automobile în Fürth, Germania. Telefon, email, program și formular de contact.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=2">
  <link rel="icon" href="assets/img/brand/favicon.png">
</head>
<body>
  <div id="site-header"></div>

  <section class="page-hero">
    <div class="container">
      <h1>Contact</h1>
      <p>Suntem aici pentru orice întrebare. Scrie-ne sau sună-ne.</p>
    </div>
  </section>

  <section class="section" style="padding-top:34px">
    <div class="container">
      <div class="contact-cta" id="contactCTA"></div>
      <div class="contact-grid">
        <div class="contact-info" id="contactInfo"></div>
        <div class="contact-form">
          <h3 style="margin-bottom:20px">Trimite-ne un mesaj</h3>
          <form id="contactForm">
            <div class="field"><label>Nume</label><input type="text" name="name" required></div>
            <div class="field"><label>Telefon</label><input type="tel" name="phone" required></div>
            <div class="field"><label>Email</label><input type="email" name="email"></div>
            <div class="field"><label>Mesaj</label><textarea name="message" required></textarea></div>
            <button type="submit" class="btn btn-primary btn-block">Trimite mesaj</button>
          </form>
          <p id="formNote" style="margin-top:14px;font-size:13px;color:var(--text-muted)"></p>
        </div>
      </div>

      <div class="contact-map" style="margin-top:40px">
        <iframe title="Hartă" loading="lazy" src="https://www.google.com/maps?q=F%C3%BCrth%2C%20Germania&output=embed"></iframe>
      </div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="assets/js/app.js"></script>
  <script>
    (async () => {
      await T24.mount('contact');
      const c = T24.config.company;
      const wa = (c.whatsapp || '').replace(/\D/g, '');
      const addr = `${c.name}, ${c.address.street}, ${c.address.zip} ${c.address.city}, ${c.address.country}`;
      const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(addr)}`;

      // Butoane acțiune rapidă
      document.getElementById('contactCTA').innerHTML = `
        <a href="https://wa.me/${wa}" target="_blank" rel="noopener" class="btn btn-wa">${T24.icon('whatsapp', 20)} Scrie pe WhatsApp</a>
        <a href="tel:${c.phone}" class="btn btn-primary">${T24.icon('phone', 20)} Sună acum</a>
        <a href="${navUrl}" target="_blank" rel="noopener" class="btn btn-outline">${T24.icon('pin', 20)} Navighează până la noi</a>`;

      // Date contact
      const info = [
        ['pin', 'Adresă', `${c.name} · ${c.address.street}<br>${c.address.zip} ${c.address.city}, ${c.address.country}<br><a href="${navUrl}" target="_blank" rel="noopener" style="color:var(--gold)">Deschide în Google Maps →</a>`],
        ['phone', 'Telefon', `<a href="tel:${c.phone}">${c.phone}</a>`],
        ['whatsapp', 'WhatsApp', `<a href="https://wa.me/${wa}" target="_blank" rel="noopener">Scrie-ne pe WhatsApp</a>`],
        ['mail', 'Email', `<a href="mailto:${c.email}">${c.email}</a>`],
        ['clock', 'Program', `Luni – Vineri: ${c.hours.weekdays}<br>Sâmbătă: ${c.hours.saturday}<br>Duminică: ${c.hours.sunday}`]
      ];
      document.getElementById('contactInfo').innerHTML = info.map(([ic, t, d]) =>
        `<div class="info-item"><div class="ic">${T24.icon(ic, 22, 1.7)}</div>
         <div><h4>${t}</h4><p>${d}</p></div></div>`).join('');

      // Formular -> trimite direct pe WhatsApp (fără backend, ajunge instant pe telefon)
      document.getElementById('contactForm').addEventListener('submit', e => {
        e.preventDefault();
        const f = e.target;
        const msg = encodeURIComponent(
          `Bună ziua! Sunt ${f.name.value} (tel: ${f.phone.value}${f.email.value ? ', email: ' + f.email.value : ''}).\n\n${f.message.value}`);
        window.open(`https://wa.me/${wa}?text=${msg}`, '_blank');
        document.getElementById('formNote').textContent = 'Mulțumim! Se deschide WhatsApp cu mesajul tău — apasă trimite și te contactăm rapid.';
        f.reset();
      });

      // Date structurate — dealer auto (SEO)
      T24.setCanonical(`${T24.siteUrl()}/contact.html`);
      T24.addJsonLd({
        '@context': 'https://schema.org', '@type': 'AutoDealer',
        name: c.name, telephone: c.phone, email: c.email, url: T24.siteUrl(),
        image: `${T24.siteUrl()}/assets/img/brand/logo.png`,
        address: { '@type': 'PostalAddress', streetAddress: c.address.street, postalCode: c.address.zip, addressLocality: c.address.city, addressCountry: 'DE' },
        sameAs: [c.mobileDeUrl].filter(Boolean),
        openingHours: ['Mo-Fr 09:00-18:00', 'Sa 09:00-14:00']
      });
    })();
  </script>
</body>
</html>
