<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fahrzeuge &amp; Gebrauchtwagen in Fürth | Total24 Automobile</title>
  <meta name="description" content="Alle verfügbaren Fahrzeuge bei Total24 Automobile. Filtern Sie nach Marke, Modell, Preis, Baujahr und Kilometerstand.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=29">
  <link rel="icon" href="assets/img/brand/favicon.png">
  <link rel="icon" href="assets/img/brand/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/img/brand/favicon-64.png">
  <meta name="theme-color" content="#0e2b3e">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Total24 Automobile">
  <meta property="og:image" content="https://maruko3333.github.io/total24-automobile/assets/img/brand/showroom.jpg">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <div id="site-header"></div>

  <section class="page-hero">
    <div class="container">
      <h1>Fahrzeuge</h1>
      <p>Wählen Sie aus unseren aktuellen Angeboten.</p>
    </div>
  </section>

  <section class="section" style="padding-top:34px">
    <div class="container">
      <div class="stoc-layout">
        <!-- FILTER -->
        <aside class="filters-side" id="filtersSide">
          <div class="filters-head">
            <h3>Filter</h3>
            <button class="filters-close" id="filterClose" aria-label="Filter schließen">✕</button>
          </div>
          <div class="field"><label>Marke</label><select id="fMake"></select></div>
          <div class="field"><label>Modell</label><select id="fModel"></select></div>
          <div class="field">
            <label>Höchstpreis</label>
            <div class="range-wrap">
              <div class="range-values"><span>bis</span><span id="priceVal">30.000 €</span></div>
              <input type="range" id="fPrice" min="0" max="80000" step="1000" value="80000">
              <div class="range-values" style="margin-top:6px"><span>0 €</span><span id="priceMax">80.000 €</span></div>
            </div>
          </div>
          <div class="field"><label>Baujahr</label><select id="fYear"></select></div>
          <div class="field"><label>Max. Kilometerstand</label>
            <select id="fKm">
              <option value="">Beliebig</option>
              <option value="50000">bis 50.000 km</option>
              <option value="100000">bis 100.000 km</option>
              <option value="150000">bis 150.000 km</option>
              <option value="200000">bis 200.000 km</option>
            </select>
          </div>
          <div class="field"><label>Kraftstoff</label><select id="fFuel"></select></div>
          <div class="field"><label>Getriebe</label><select id="fGear"></select></div>
          <div class="field"><label>Karosserie</label><select id="fBody"></select></div>
          <button class="btn btn-primary btn-block" id="fApplyCount">Filtern</button>
          <button class="btn btn-ghost btn-block" id="fReset" style="margin-top:8px">Filter zurücksetzen</button>
        </aside>

        <!-- ERGEBNISSE -->
        <div>
          <div class="stoc-toolbar">
            <span class="count" id="carsCount"><b>0</b> Fahrzeuge verfügbar</span>
            <div class="toolbar-actions">
              <button class="btn-filter-m" id="filterOpen">Filter</button>
              <button class="fav-toggle" id="favToggle" aria-pressed="false">Meine Favoriten <b id="favCount">0</b></button>
              <div class="sort-box">
                <label>Sortieren:</label>
                <select id="fSort">
                  <option value="">Empfohlen</option>
                  <option value="year-desc">Neueste</option>
                  <option value="price-asc">Preis aufsteigend</option>
                  <option value="price-desc">Preis absteigend</option>
                  <option value="km-asc">Wenig Kilometer</option>
                </select>
              </div>
            </div>
          </div>
          <div class="cars-grid" id="carsGrid"></div>
        </div>
      </div>
    </div>
    <div class="filter-backdrop" id="filterBackdrop"></div>
  </section>

  <div id="site-footer"></div>

  <script src="assets/js/app.js?v=2"></script>
  <script src="assets/js/cars.js?v=2"></script>
  <script>
    (async () => { await T24.mount('stoc'); Cars.initStoc(); })();
  </script>
</body>
</html>
