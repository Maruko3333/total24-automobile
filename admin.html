<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Total24 Automobile</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=43">
  <link rel="icon" href="assets/img/brand/favicon.png">
  <style>
    .admin-wrap { padding: 40px 0 80px; }
    .admin-head { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; margin-bottom:28px; }
    .admin-head h1 { font-size:28px; }
    .admin-head .actions { display:flex; gap:10px; flex-wrap:wrap; }
    .btn-sm { padding:8px 14px; font-size:13px; }
    .btn-outline.danger:hover { border-color:var(--red); color:var(--red); }
    .admin-row { display:flex; align-items:center; gap:16px; background:var(--bg-card); border:1px solid var(--line-soft); border-radius:12px; padding:12px 16px; margin-bottom:12px; }
    .admin-thumb { width:70px; height:52px; border-radius:8px; overflow:hidden; background:var(--bg-card-hi); display:grid; place-items:center; color:var(--text-muted); flex-shrink:0; }
    .admin-thumb img { width:100%; height:100%; object-fit:cover; }
    .admin-info { flex:1; }
    .admin-info b { display:block; font-family:var(--font-head); }
    .admin-info span { color:var(--text-muted); font-size:13px; }
    .admin-info em { font-style:normal; }
    .status-available { color:var(--green); } .status-reserved { color:var(--gold); } .status-sold { color:var(--red); }
    .admin-acts { display:flex; gap:8px; }
    .admin-banner { background:var(--gold-soft); border:1px solid rgba(245,179,1,.25); border-radius:12px; padding:16px 18px; color:var(--text-soft); font-size:14px; margin-bottom:24px; line-height:1.6; }
    .admin-banner b { color:var(--gold-hi); }
    #adminStatus { font-weight:600; font-size:14px; min-height:20px; }
    /* modal */
    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:200; padding:30px 16px; overflow-y:auto; }
    .modal.open { display:block; }
    .modal-card { max-width:760px; margin:0 auto; background:var(--bg-elev); border:1px solid var(--line); border-radius:16px; padding:30px; }
    .modal-card h2 { font-size:22px; margin-bottom:22px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .form-grid .full { grid-column:1/-1; }
    .form-grid label { display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; }
    .form-grid input, .form-grid select, .form-grid textarea { width:100%; padding:10px 12px; background:var(--bg); border:1px solid var(--line); border-radius:9px; color:var(--text); font-family:inherit; font-size:14px; }
    .form-grid textarea { min-height:80px; resize:vertical; }
    .form-check { display:flex; align-items:center; gap:8px; }
    .form-check input { width:auto; }
    .img-drop { border:1.5px dashed var(--line); border-radius:10px; padding:18px; text-align:center; color:var(--text-muted); cursor:pointer; font-size:14px; }
    .img-drop:hover { border-color:var(--gold); color:var(--gold); }
    .img-preview { display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
    .img-chip { position:relative; width:90px; height:66px; border-radius:8px; overflow:hidden; border:1px solid var(--line); }
    .img-chip img { width:100%; height:100%; object-fit:cover; }
    .img-chip button { position:absolute; top:3px; right:3px; width:22px; height:22px; border-radius:6px; background:rgba(0,0,0,.7); border:0; color:#fff; cursor:pointer; display:grid; place-items:center; }
    .modal-foot { display:flex; justify-content:flex-end; gap:12px; margin-top:24px; }
    @media (max-width:600px){ .form-grid{ grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <div class="admin-wrap">
    <div class="container">
      <div class="admin-banner">
        🔒 <b>Panou intern.</b> Modificările se salvează în browserul tău. Ca să apară pe site: apasă <b>„Exportă cars.json"</b>,
        înlocuiește fișierul <b>data/cars.json</b> din proiect și fă <b>commit + push pe GitHub</b>.
      </div>
      <div class="admin-head">
        <h1>Administrare stoc <span style="color:var(--text-muted);font-size:16px">(<span id="adminCount">0</span> mașini)</span></h1>
        <div class="actions">
          <span id="adminStatus"></span>
          <button class="btn btn-primary btn-sm" id="btnNew">+ Adaugă mașină</button>
          <button class="btn btn-outline btn-sm" id="btnExport">Exportă cars.json</button>
          <button class="btn btn-outline btn-sm" id="btnImport">Importă</button>
          <input type="file" id="importFile" accept="application/json" hidden>
        </div>
      </div>
      <div id="adminList"></div>
    </div>
  </div>

  <!-- FORM MODAL -->
  <div class="modal" id="formModal">
    <div class="modal-card">
      <h2 id="formTitle">Adaugă mașină</h2>
      <form id="carForm">
        <div class="form-grid">
          <div><label>Marcă</label><input name="make" required placeholder="BMW"></div>
          <div><label>Model</label><input name="model" required placeholder="X5 xDrive40d"></div>
          <div><label>An fabricație</label><input name="year" type="number" required placeholder="2021"></div>
          <div><label>Prima înmatriculare</label><input name="firstReg" placeholder="2021-04"></div>
          <div><label>Preț (€)</label><input name="price" type="number" required placeholder="54900"></div>
          <div><label>Kilometraj</label><input name="mileage" type="number" required placeholder="68000"></div>
          <div><label>Combustibil</label>
            <select name="fuel"><option>Diesel</option><option>Benzină</option><option>Hibrid</option><option>Electric</option><option>GPL</option></select></div>
          <div><label>Transmisie</label>
            <select name="transmission"><option>Automată</option><option>Manuală</option></select></div>
          <div><label>Putere (CP)</label><input name="power" type="number" placeholder="340"></div>
          <div><label>Motor</label><input name="engine" placeholder="3.0d"></div>
          <div><label>Capacitate (cm³)</label><input name="capacity" type="number" placeholder="2993"></div>
          <div><label>Culoare</label><input name="color" placeholder="Negru Metalizat"></div>
          <div><label>Caroserie</label>
            <select name="body"><option>Sedan</option><option>SUV</option><option>Break</option><option>Hatchback</option><option>Coupé</option><option>Cabrio</option><option>Monovolum</option></select></div>
          <div><label>CO₂ (g/km)</label><input name="co2" type="number" placeholder="179"></div>
          <div><label>Uși</label><input name="doors" type="number" placeholder="5"></div>
          <div><label>Locuri</label><input name="seats" type="number" placeholder="5"></div>
          <div class="full"><label>Dotări (separate prin virgulă)</label>
            <input name="features" placeholder="Trapă panoramică, Navigație, Scaune încălzite"></div>
          <div class="full"><label>Descriere</label><textarea name="description" placeholder="Descriere mașină..."></textarea></div>
          <div><label>Status</label>
            <select name="status"><option value="available">Disponibilă</option><option value="reserved">Rezervată</option><option value="sold">Vândută</option></select></div>
          <div class="form-check" style="align-self:end"><input type="checkbox" name="featured" id="featured"><label for="featured" style="margin:0;text-transform:none">Afișează pe prima pagină (recomandată)</label></div>
          <div class="full">
            <label>Fotografii</label>
            <div class="img-drop" onclick="document.getElementById('imgInput').click()">📷 Click pentru a încărca poze (se redimensionează automat)</div>
            <input type="file" id="imgInput" accept="image/*" multiple hidden>
            <div class="img-preview" id="imgPreview"></div>
          </div>
        </div>
        <div class="modal-foot">
          <button type="button" class="btn btn-outline" id="btnCancel">Anulează</button>
          <button type="submit" class="btn btn-primary">Salvează</button>
        </div>
      </form>
    </div>
  </div>

  <div id="site-footer"></div>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/cars.js"></script>
  <script src="assets/js/admin.js"></script>
  <script>
    (async () => { await T24.mount(''); Admin.init(); })();
  </script>
</body>
</html>
